# Tick BD — single-node replica set (local dev)
# Homebrew: copy or merge into your mongod.conf, then restart MongoDB.
#   Apple Silicon: /opt/homebrew/etc/mongod.conf
#   Intel:         /usr/local/etc/mongod.conf
#
# Start manually:
#   mongod --config /path/to/this/mongod.replica-set.conf
# Then run: npm run mongo:rs-init  (from repo root)

storage:
  dbPath: /opt/homebrew/var/mongodb

systemLog:
  destination: file
  path: /opt/homebrew/var/log/mongodb/mongo.log
  logAppend: true

net:
  port: 27017
  bindIp: 127.0.0.1

replication:
  replSetName: rs0
